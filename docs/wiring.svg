<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 560" font-family="Helvetica, Arial, sans-serif" font-size="14" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="860" height="560" fill="#ffffff"/>
  <text x="430" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">ESP32 DOOM — Bağlantı Şeması</text>

  <!-- ESP32 -->
  <rect x="300" y="70" width="220" height="400" rx="10" fill="#1f2a44" stroke="#0f172a" stroke-width="2"/>
  <text x="410" y="100" text-anchor="middle" fill="#fff" font-size="16" font-weight="bold">ESP32 DevKit V1</text>
  <rect x="370" y="420" width="80" height="40" rx="4" fill="#9ca3af"/>
  <text x="410" y="445" text-anchor="middle" fill="#111" font-size="12">USB</text>

  <!-- ESP32 right-side pins (to TFT) -->
  <g fill="#fff" font-size="13">
    <text x="505" y="145" text-anchor="end">D13</text>
    <text x="505" y="180" text-anchor="end">D14</text>
    <text x="505" y="215" text-anchor="end">D15</text>
    <text x="505" y="250" text-anchor="end">D27</text>
    <text x="505" y="285" text-anchor="end">D26</text>
    <text x="505" y="320" text-anchor="end">3V3</text>
    <text x="505" y="355" text-anchor="end">GND</text>
  </g>
  <!-- ESP32 left-side pins (to buttons) -->
  <g fill="#fff" font-size="13">
    <text x="315" y="145">D19</text>
    <text x="315" y="200">D4</text>
    <text x="315" y="255">D32</text>
    <text x="315" y="310">D25</text>
    <text x="315" y="365">D33</text>
    <text x="315" y="400">GND</text>
  </g>

  <!-- TFT -->
  <rect x="660" y="110" width="170" height="260" rx="8" fill="#b91c1c" stroke="#7f1d1d" stroke-width="2"/>
  <rect x="760" y="150" width="58" height="170" rx="3" fill="#111"/>
  <text x="789" y="240" text-anchor="middle" fill="#fff" font-size="11" transform="rotate(-90 789 240)">1.44" ST7735 TFT</text>
  <g fill="#fff" font-size="13">
    
  </g>
  <g fill="#fff" font-size="13">
    <text x="672" y="215">CS</text>
    <text x="672" y="250">A0 / DC</text>
    <text x="672" y="285">RESET</text>
    <text x="672" y="320">VCC + LED</text>
    <text x="672" y="355">GND</text>
  </g>

  <!-- TFT wires -->
  <g stroke-width="3" fill="none">
    <path d="M520 140 H660" stroke="#f59e0b"/>
    <path d="M520 175 H660" stroke="#f97316"/>
    <path d="M520 210 H660" stroke="#a855f7"/>
    <path d="M520 245 H660" stroke="#22c55e"/>
    <path d="M520 280 H660" stroke="#0ea5e9"/>
    <path d="M520 315 H660" stroke="#dc2626"/>
    <path d="M520 350 H660" stroke="#111827"/>
  </g>
  <g fill="#222" font-size="12">
    <text x="590" y="134" text-anchor="middle">SDA (MOSI)</text>
    <text x="590" y="169" text-anchor="middle">SCK / SCL</text>
  </g>
  <text x="672" y="145" fill="#fff" font-size="13">SDA</text>
  <text x="672" y="180" fill="#fff" font-size="13">SCK</text>

  <!-- Buttons -->
  <g font-size="13" fill="#222">
    <g>
      <path d="M300 140 H200" stroke="#eab308" stroke-width="3"/>
      <rect x="150" y="125" width="50" height="30" rx="5" fill="#e5e7eb" stroke="#374151"/>
      <circle cx="175" cy="140" r="8" fill="#dc2626"/>
      <text x="175" y="120" text-anchor="middle">ATEŞ</text>
    </g>
    <g>
      <path d="M300 195 H200" stroke="#eab308" stroke-width="3"/>
      <rect x="150" y="180" width="50" height="30" rx="5" fill="#e5e7eb" stroke="#374151"/>
      <circle cx="175" cy="195" r="8" fill="#374151"/>
      <text x="175" y="175" text-anchor="middle">İLERİ</text>
    </g>
    <g>
      <path d="M300 250 H200" stroke="#eab308" stroke-width="3"/>
      <rect x="150" y="235" width="50" height="30" rx="5" fill="#e5e7eb" stroke="#374151"/>
      <circle cx="175" cy="250" r="8" fill="#374151"/>
      <text x="175" y="230" text-anchor="middle">SOLA BAK</text>
    </g>
    <g>
      <path d="M300 305 H200" stroke="#eab308" stroke-width="3"/>
      <rect x="150" y="290" width="50" height="30" rx="5" fill="#e5e7eb" stroke="#374151"/>
      <circle cx="175" cy="305" r="8" fill="#374151"/>
      <text x="175" y="285" text-anchor="middle">SAĞA BAK</text>
    </g>
    <g>
      <path d="M300 360 H200" stroke="#eab308" stroke-width="3"/>
      <rect x="150" y="345" width="50" height="30" rx="5" fill="#e5e7eb" stroke="#374151"/>
      <circle cx="175" cy="360" r="8" fill="#374151"/>
      <text x="175" y="340" text-anchor="middle">GERİ</text>
    </g>
  </g>
  <!-- GND bus for buttons -->
  <g stroke="#111827" stroke-width="3" fill="none">
    <path d="M150 140 H120 M150 195 H120 M150 250 H120 M150 305 H120 M150 360 H120"/>
    <path d="M120 140 V500 H260 V395 H300"/>
  </g>
  <text x="190" y="520" text-anchor="middle" fill="#111" font-size="13">Ortak GND hattı</text>

  <text x="430" y="545" text-anchor="middle" fill="#555" font-size="12">Butonlar dahili pull-up ile okunur (basınca LOW). 4 bacaklı butonlarda kabloları çapraz bacaklara takın.</text>
</svg>
