<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 720" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <rect width="900" height="720" fill="#ffffff"/>
  <text x="450" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">ESP32 Gece Konsolu — Bağlantı Şeması</text>

  <!-- ESP32 -->
  <rect x="320" y="70" width="240" height="560" rx="10" fill="#1f2a44" stroke="#0f172a" stroke-width="2"/>
  <text x="440" y="100" text-anchor="middle" fill="#fff" font-size="16" font-weight="bold">ESP32 DevKit V1</text>
  <text x="440" y="120" text-anchor="middle" fill="#94a3b8" font-size="11">D12 ve GPIO6–11 boş kalmalı</text>
  <rect x="400" y="580" width="80" height="40" rx="4" fill="#9ca3af"/>
  <text x="440" y="605" text-anchor="middle" fill="#111" font-size="12">USB</text>

  <!-- ESP32 sağ pinler: ekran (HSPI) ve SD kart (VSPI) -->
  <g fill="#fff" font-size="13">
    <text x="545" y="145" text-anchor="end">D13</text>
    <text x="545" y="180" text-anchor="end">D14</text>
    <text x="545" y="215" text-anchor="end">D15</text>
    <text x="545" y="250" text-anchor="end">D27</text>
    <text x="545" y="285" text-anchor="end">D26</text>
    <text x="545" y="320" text-anchor="end">3V3</text>
    <text x="545" y="355" text-anchor="end">GND</text>
    <text x="545" y="425" text-anchor="end">D18</text>
    <text x="545" y="460" text-anchor="end">D23</text>
    <text x="545" y="495" text-anchor="end">D21</text>
    <text x="545" y="530" text-anchor="end">D5</text>
    <text x="545" y="565" text-anchor="end">VIN (5V)</text>
    <text x="545" y="600" text-anchor="end">GND</text>
  </g>
  <!-- ESP32 sol pinler: butonlar -->
  <g fill="#fff" font-size="13">
    <text x="335" y="145">D19</text>
    <text x="335" y="200">D4</text>
    <text x="335" y="255">D32</text>
    <text x="335" y="310">D25</text>
    <text x="335" y="365">D33</text>
    <text x="335" y="420">D22</text>
    <text x="335" y="475">GND</text>
  </g>

  <!-- TFT -->
  <rect x="700" y="110" width="170" height="260" rx="8" fill="#b91c1c" stroke="#7f1d1d" stroke-width="2"/>
  <rect x="800" y="150" width="58" height="170" rx="3" fill="#111"/>
  <text x="829" y="240" text-anchor="middle" fill="#fff" font-size="11" transform="rotate(-90 829 240)">1.44" ST7735 TFT</text>
  <g fill="#fff" font-size="13">
    <text x="712" y="145">SDA</text>
    <text x="712" y="180">SCK</text>
    <text x="712" y="215">CS</text>
    <text x="712" y="250">A0 / DC</text>
    <text x="712" y="285">RESET</text>
    <text x="712" y="320">VCC + LED</text>
    <text x="712" y="355">GND</text>
  </g>
  <g stroke-width="3" fill="none">
    <path d="M560 140 H700" stroke="#f59e0b"/>
    <path d="M560 175 H700" stroke="#f97316"/>
    <path d="M560 210 H700" stroke="#a855f7"/>
    <path d="M560 245 H700" stroke="#22c55e"/>
    <path d="M560 280 H700" stroke="#0ea5e9"/>
    <path d="M560 315 H700" stroke="#dc2626"/>
    <path d="M560 350 H700" stroke="#111827"/>
  </g>
  <g fill="#222" font-size="12">
    <text x="630" y="134" text-anchor="middle">SDA (MOSI)</text>
    <text x="630" y="169" text-anchor="middle">SCK / SCL</text>
    <text x="630" y="388" text-anchor="middle" fill="#555">Ekran: HSPI</text>
  </g>

  <!-- SD kart modülü -->
  <rect x="700" y="400" width="170" height="220" rx="8" fill="#0f766e" stroke="#134e4a" stroke-width="2"/>
  <rect x="808" y="450" width="50" height="120" rx="4" fill="#111"/>
  <rect x="816" y="462" width="34" height="44" rx="2" fill="#cbd5e1"/>
  <text x="833" y="540" text-anchor="middle" fill="#fff" font-size="11" transform="rotate(-90 833 540)">microSD</text>
  <g fill="#fff" font-size="13">
    <text x="712" y="425">SCK</text>
    <text x="712" y="460">MOSI</text>
    <text x="712" y="495">MISO</text>
    <text x="712" y="530">CS</text>
    <text x="712" y="565">VCC</text>
    <text x="712" y="600">GND</text>
  </g>
  <g stroke-width="3" fill="none">
    <path d="M560 420 H700" stroke="#f59e0b"/>
    <path d="M560 455 H700" stroke="#a855f7"/>
    <path d="M560 490 H700" stroke="#22c55e"/>
    <path d="M560 525 H700" stroke="#0ea5e9"/>
    <path d="M560 560 H700" stroke="#dc2626"/>
    <path d="M560 595 H700" stroke="#111827"/>
  </g>
  <g fill="#222" font-size="12">
    <text x="630" y="414" text-anchor="middle">SD kart: VSPI</text>
    <text x="630" y="644" text-anchor="middle" fill="#555">FAT32, isteğe bağlı</text>
  </g>

  <!-- Butonlar -->
  <g font-size="13" fill="#222">
    <g>
      <path d="M320 140 H220" stroke="#eab308" stroke-width="3"/>
      <rect x="170" y="125" width="50" height="30" rx="5" fill="#e5e7eb" stroke="#374151"/>
      <circle cx="195" cy="140" r="8" fill="#dc2626"/>
      <text x="195" y="120" text-anchor="middle">ATEŞ</text>
    </g>
    <g>
      <path d="M320 195 H220" stroke="#eab308" stroke-width="3"/>
      <rect x="170" y="180" width="50" height="30" rx="5" fill="#e5e7eb" stroke="#374151"/>
      <circle cx="195" cy="195" r="8" fill="#374151"/>
      <text x="195" y="175" text-anchor="middle">İLERİ</text>
    </g>
    <g>
      <path d="M320 250 H220" stroke="#eab308" stroke-width="3"/>
      <rect x="170" y="235" width="50" height="30" rx="5" fill="#e5e7eb" stroke="#374151"/>
      <circle cx="195" cy="250" r="8" fill="#374151"/>
      <text x="195" y="230" text-anchor="middle">SOLA</text>
    </g>
    <g>
      <path d="M320 305 H220" stroke="#eab308" stroke-width="3"/>
      <rect x="170" y="290" width="50" height="30" rx="5" fill="#e5e7eb" stroke="#374151"/>
      <circle cx="195" cy="305" r="8" fill="#374151"/>
      <text x="195" y="285" text-anchor="middle">SAĞA</text>
    </g>
    <g>
      <path d="M320 360 H220" stroke="#eab308" stroke-width="3"/>
      <rect x="170" y="345" width="50" height="30" rx="5" fill="#e5e7eb" stroke="#374151"/>
      <circle cx="195" cy="360" r="8" fill="#374151"/>
      <text x="195" y="340" text-anchor="middle">GERİ</text>
    </g>
    <g>
      <path d="M320 415 H220" stroke="#eab308" stroke-width="3"/>
      <rect x="170" y="400" width="50" height="30" rx="5" fill="#e5e7eb" stroke="#374151"/>
      <circle cx="195" cy="415" r="8" fill="#2563eb"/>
      <text x="195" y="395" text-anchor="middle">RELOAD</text>
    </g>
  </g>
  <!-- Butonlar için ortak GND hattı -->
  <g stroke="#111827" stroke-width="3" fill="none">
    <path d="M170 140 H140 M170 195 H140 M170 250 H140 M170 305 H140 M170 360 H140 M170 415 H140"/>
    <path d="M140 140 V520 H280 V470 H320"/>
  </g>
  <text x="210" y="540" text-anchor="middle" fill="#111" font-size="13">Ortak GND hattı</text>

  <text x="450" y="675" text-anchor="middle" fill="#555" font-size="12">Butonlar dahili pull-up ile okunur (basınca LOW). 4 bacaklı butonlarda kabloları çapraz bacaklara takın.</text>
  <text x="450" y="695" text-anchor="middle" fill="#555" font-size="12">SD modülü VIN'den (5V) beslenir; modülün kendi 3.3V regülatörü ve seviye dönüştürücüsü olmalıdır.</text>
</svg>
