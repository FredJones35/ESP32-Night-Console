; ESP32 Gece Konsolu — ESP32 DevKit V1 + 1.44" 128x128 ST7735 + 6 buton + isteğe bağlı SD kart
[env:esp32doit-devkit-v1]
platform = espressif32@6.9.0
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
board_build.f_cpu = 240000000L
board_build.partitions = huge_app.csv
lib_deps =
    bodmer/TFT_eSPI@^2.5.43

build_unflags = -Os
build_src_flags = -Wall -Wextra
build_flags =
    -O2
    ; --- TFT_eSPI ayarları (User_Setup.h yerine) ---
    -D USER_SETUP_LOADED=1
    -D ST7735_DRIVER=1
    -D ST7735_GREENTAB3=1        ; 128x128, kaydirma 2/3 px. Kenarda 1-2 px cop varsa GREENTAB2 veya BLACKTAB dene
    -D TFT_WIDTH=128
    -D TFT_HEIGHT=128
    ; -D TFT_RGB_ORDER=TFT_BGR   ; kırmızı/mavi ters görünürse bu satırı aç
    -D USE_HSPI_PORT=1           ; ekran HSPI'de, VSPI SD karta kalsin (ekran kablolari ayni)
    -D TFT_MOSI=13               ; ekranda SDA
    -D TFT_MISO=-1               ; MISO yok -> D19 (ates butonu) serbest kalsin
    -D TFT_SCLK=14               ; ekranda SCK / SCL
    -D TFT_CS=15
    -D TFT_DC=27                 ; ekranda A0 / DC / RS
    -D TFT_RST=26
    -D LOAD_GLCD=1
    -D DISABLE_ALL_LIBRARY_WARNINGS=1   ; dokunmatik (TOUCH_CS) uyarisi kapali
    -D SPI_FREQUENCY=27000000    ; görüntü bozuksa 20000000'e düşür
